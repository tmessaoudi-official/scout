# Q8's deployment: Docker on a VPS, `state/` on a mounted volume, `scout run --watch`.
#
# FIRST RUN ON A FRESH HOST — seed before you start the watcher:
#
#     cp .env.example .env && $EDITOR .env      # a push channel, or nothing reaches you
#     docker compose run --rm rent-scout doctor      # sources reachable? journal WAL? channels usable?
#     docker compose run --rm rent-scout run --once --seed
#     docker compose up -d                      # every watcher (rent, car, job)
#
# The seed step is not optional and skipping it is not silent-but-fine. Q36 makes `run` REFUSE on an
# empty seen-set, because an empty seen-set is what a forgotten volume mount looks like and the
# alternative is notifying the entire back catalogue at once. Combined with `restart: unless-stopped`
# that refusal becomes a restart loop — visible, thanks to Q27's `rent-last-refusal.txt`, but a loop. Seed
# first and it starts clean.

services:
  rent-scout:
    build:
      context: .
    image: scout:local
    # The domain flag is in the ENTRYPOINT for the same reason as the car service below: a verb typed
    # after the service name must be a rent verb, and the image itself names no domain (its CMD is
    # `help`, which lists them).
    entrypoint: ["php", "/app/bin/scout", "--domain=rent"]
    command: ["run", "--watch"]
    # `no-new-privileges` because nothing here ever needs to escalate, and the image already runs as
    # a non-root user. Cheap, and it closes a class of surprise from a future base-image change.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # The image runs as uid 10001, and a bind-mounted host directory belongs to whoever created it.
    # Measured, running the real container against a host `state/`: PDO could not create the database
    # and the process died. So the uid is configurable and defaults to the operator's — set
    # `SCOUT_UID`/`SCOUT_GID` in `.env`, or run `SCOUT_UID=$(id -u) SCOUT_GID=$(id -g) docker compose up -d`.
    # 1000:1000 is the ordinary first-user id on a Debian/Ubuntu VPS, which is what Q8 prescribes.
    user: "${SCOUT_UID:-1000}:${SCOUT_GID:-1000}"
    volumes:
      # THE mounted volume of Q8. Everything that must outlive the container lives here: the
      # seen-set, the price history, the run log, the Q27 heartbeat marker and `rent-last-refusal.txt`.
      # Deleting it makes the next run re-notify the entire market, and the price history is not
      # reconstructible — a listing only ever shows its CURRENT rent.
      #
      # A bind mount rather than a named volume, deliberately: this file is the thing the project
      # tells you to back up, and `docker compose down -v` deletes a named one without ceremony.
      - ./state:/app/state
      # Read-only, so a running container cannot rewrite the criteria that decide what is filtered.
      # A wrong filter is invisible: the user sees plausible results forever.
      - ./config:/app/config:ro
    env_file:
      # OPTIONAL, and that is the point. A fresh clone has no `.env` — it is gitignored — and a
      # mandatory entry makes even `docker compose config` fail before the operator has done
      # anything wrong. Q9 also rules every channel optional: `console` always works, so the stack
      # must be able to start without credentials and say so, rather than refusing to parse.
      - path: .env
        required: false
    environment:
      # Q34. Named here as well as in the image so that changing the deployment's timezone does not
      # need a rebuild.
      TZ: ${TZ:-Europe/Paris}
    restart: unless-stopped
    # Docker's default is 10 SECONDS, which is less than a single In'li fetch (~24 s measured). A
    # redeploy would therefore SIGKILL the watcher mid-pass every time — and a pass killed between
    # "notification sent" and "notified_at written" is the duplicate-notification storm that
    # WatchLoop's clean-shutdown design exists to prevent. Sized to comfortably exceed one full pass
    # across every enabled source.
    stop_grace_period: 5m
    # The logs are a diagnostic, not the notification channel — a container log is explicitly NOT a
    # usable channel under Q9. Bounded so a watcher running for months cannot fill the VPS disk and
    # take the seen-set down with it.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # THE CAR DOMAIN (2026-08-29): the same image, its own database in the same mounted volume
  # (`state/car-watch.sqlite3`), its own heartbeat marker and push topic (`CAR_NTFY_TOPIC`). Seed it
  # first, for the same Q36 reason as the rent watcher — and here the seed is load-bearing rather
  # than hygiene: Autohero's sitemap is ~3 400 lots, and an unseeded first pass would push them all.
  #
  #     docker compose run --rm car-scout doctor
  #     docker compose run --rm car-scout run --once --seed
  #     docker compose up -d car-scout
  car-scout:
    image: scout:local
    # The domain flag is in the ENTRYPOINT, not the command: `docker compose run --rm car-scout
    # doctor` REPLACES the command, and with the flag there the first deploy ran the RENT doctor and
    # the rent seed instead (2026-08-29 22:2x — measured, and repaired). With it here, every verb
    # typed after the service name is a car verb.
    entrypoint: ["php", "/app/bin/scout", "--domain=car"]
    command: ["run", "--watch"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "${SCOUT_UID:-1000}:${SCOUT_GID:-1000}"
    volumes:
      - ./state:/app/state
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Paris}
    restart: unless-stopped
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # THE JOB DOMAIN (2026-09-14): the same image, its own database in the same mounted volume
  # (`state/job-watch.sqlite3`), its own heartbeat marker and push topic (`JOB_NTFY_TOPIC`). One
  # source, LinkedIn alerts over IMAP. Seed it first, for the same Q36 reason as the other two — the
  # 7-day IMAP window holds every alert of the week, and an unseeded first pass would push them all.
  # Push channels come from the gitignored `config/job/criteria.local.json`; the shipped criteria
  # notify the console only.
  #
  #     docker compose run --rm job-scout doctor
  #     docker compose run --rm job-scout run --once --seed
  #     docker compose up -d job-scout
  job-scout:
    image: scout:local
    # In the ENTRYPOINT for the car service's reason: a verb typed after the service name must be a
    # job verb.
    entrypoint: ["php", "/app/bin/scout", "--domain=job"]
    command: ["run", "--watch"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "${SCOUT_UID:-1000}:${SCOUT_GID:-1000}"
    volumes:
      - ./state:/app/state
      - ./config:/app/config:ro
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Paris}
    restart: unless-stopped
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
